<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fied</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='s' cx='40%25' cy='35%25' r='55%25'%3E%3Cstop offset='0%25' stop-color='%237dcfff'/%3E%3Cstop offset='50%25' stop-color='%235a9ecf'/%3E%3Cstop offset='100%25' stop-color='%232a5a7a'/%3E%3C/radialGradient%3E%3CradialGradient id='g' cx='30%25' cy='25%25' r='70%25'%3E%3Cstop offset='0%25' stop-color='%23fff' stop-opacity='.25'/%3E%3Cstop offset='100%25' stop-color='%23fff' stop-opacity='0'/%3E%3C/radialGradient%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='4' seed='3' stitchTiles='stitch' result='noise'/%3E%3CfeColorMatrix type='saturate' values='0' in='noise' result='mono'/%3E%3CfeBlend in='SourceGraphic' in2='mono' mode='overlay' result='blended'/%3E%3CfeComposite in='blended' in2='SourceGraphic' operator='in'/%3E%3C/filter%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='14' fill='url(%23s)' filter='url(%23n)'/%3E%3Ccircle cx='16' cy='16' r='14' fill='url(%23g)'/%3E%3Ccircle cx='12' cy='11' r='3' fill='%23fff' opacity='.12'/%3E%3C/svg%3E" />
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; width: 100%; overflow: hidden; background: #000; color: #c7c7c7; font-family: -apple-system, system-ui, sans-serif; }
      #terminal-container { height: 100%; width: 100%; display: none; }
      .xterm { height: 100%; }
      #landing {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 32px;
      }
      #landing .logo-area { display: flex; flex-direction: column; align-items: center; gap: 12px; }
      #landing .logo-sphere {
        width: 72px;
        height: 72px;
      }
      #landing h1 { font-size: 28px; font-weight: 600; letter-spacing: 0.04em; color: #e8e8e8; }
      #landing p { color: #666; font-size: 14px; max-width: 360px; text-align: center; line-height: 1.5; }
      #landing code { background: #161616; padding: 2px 7px; border-radius: 4px; font-size: 13px; color: #7dcfff; }
      #landing .copy-block {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #111;
        border: 1px solid #222;
        border-radius: 6px;
        padding: 8px 12px;
        cursor: pointer;
        transition: border-color 0.15s;
        user-select: none;
      }
      #landing .copy-block:hover { border-color: #444; }
      #landing .copy-block code { background: none; padding: 0; font-size: 14px; }
      #landing .copy-block .copy-icon { width: 16px; height: 16px; color: #555; transition: color 0.15s; flex-shrink: 0; }
      #landing .copy-block:hover .copy-icon { color: #7dcfff; }
      #landing .copy-block.copied .copy-icon { color: #9ece6a; }
      #landing .links { display: flex; gap: 20px; }
      #landing .links a {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: 8px;
        color: #666;
        transition: color 0.15s, background 0.15s;
      }
      #landing .links a:hover { color: #e8e8e8; background: #161616; }
      #landing .links a svg { width: 22px; height: 22px; fill: currentColor; }
      #error-view {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 12px;
        color: #888;
        font-family: monospace;
        font-size: 13px;
        text-align: center;
        padding: 24px;
      }
      #error-view .error-title { color: #e55; font-weight: 600; }
      #error-view .error-detail { max-width: 420px; line-height: 1.6; }
      #mobile-keybar { display: none; }
      #mobile-keybar-toggle { display: none; }
      @media (pointer: coarse) {
        #mobile-keybar-toggle {
          display: inline-flex;
          position: fixed;
          top: calc(10px + env(safe-area-inset-top));
          right: 10px;
          z-index: 40;
          width: 34px;
          height: 34px;
          align-items: center;
          justify-content: center;
          border: 1px solid #2a2a2a;
          border-radius: 999px;
          background: rgba(12, 12, 12, 0.9);
          color: #b6b6b6;
          backdrop-filter: blur(8px);
          -webkit-backdrop-filter: blur(8px);
        }
        #mobile-keybar-toggle svg {
          width: 16px;
          height: 16px;
          fill: none;
          stroke: currentColor;
          stroke-width: 2;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        #mobile-keybar-toggle.active {
          color: #7dcfff;
          border-color: #2f5770;
          background: rgba(15, 24, 32, 0.92);
        }
        #mobile-keybar {
          position: fixed;
          left: 0;
          right: 0;
          bottom: 0;
          z-index: 30;
          padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
          background: rgba(9, 9, 9, 0.94);
          border-top: 1px solid #222;
          backdrop-filter: blur(10px);
          -webkit-backdrop-filter: blur(10px);
        }
        #mobile-keybar.visible { display: block; }
        #mobile-keybar .mobile-row {
          display: flex;
          gap: 6px;
          overflow-x: auto;
          scrollbar-width: none;
          -webkit-overflow-scrolling: touch;
        }
        #mobile-keybar .mobile-row::-webkit-scrollbar { display: none; }
        #mobile-keybar .mobile-row.extra { margin-top: 6px; }
        #mobile-keybar .mobile-row.extra[hidden] { display: none; }
        #mobile-keybar button {
          border: 1px solid #2a2a2a;
          background: #151515;
          color: #d5d5d5;
          min-width: 42px;
          height: 34px;
          border-radius: 7px;
          padding: 0 10px;
          font: 600 13px/1 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }
        #mobile-keybar button:active { background: #232323; }
        #mobile-keybar button.active {
          color: #7dcfff;
          border-color: #2f5770;
          background: #0f1820;
        }
      }
    </style>
  </head>
  <body>
    <div id="landing">
      <div class="logo-area">
        <svg class="logo-sphere" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="ls" cx="40%" cy="35%" r="55%"><stop offset="0%" stop-color="#7dcfff"/><stop offset="50%" stop-color="#5a9ecf"/><stop offset="100%" stop-color="#2a5a7a"/></radialGradient>
            <radialGradient id="lg" cx="30%" cy="25%" r="70%"><stop offset="0%" stop-color="#fff" stop-opacity=".25"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient>
            <filter id="ln"><feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="4" seed="3" stitchTiles="stitch" result="noise"/><feColorMatrix type="saturate" values="0" in="noise" result="mono"/><feBlend in="SourceGraphic" in2="mono" mode="overlay" result="blended"/><feComposite in="blended" in2="SourceGraphic" operator="in"/></filter>
          </defs>
          <circle cx="16" cy="16" r="14" fill="url(#ls)" filter="url(#ln)"/>
          <circle cx="16" cy="16" r="14" fill="url(#lg)"/>
          <circle cx="12" cy="11" r="3" fill="#fff" opacity=".12"/>

        <h1>fied</h1>

      <p>Share your tmux session in the browser.<br>End-to-end encrypted.</p>

        <a href="https://www.npmjs.com/package/fied" target="_blank" rel="noopener" title="npm">

        </a>
      </div>
    </div>
    <div id="terminal-container"></div>
    <button id="mobile-keybar-toggle" type="button" aria-pressed="false" aria-label="Toggle mobile keybar">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M1.5 12s4-6.5 10.5-6.5S22.5 12 22.5 12 18.5 18.5 12 18.5 1.5 12 1.5 12z"/>
        <circle cx="12" cy="12" r="3.5"/>
      </svg>
    </button>
    <div id="mobile-keybar" aria-hidden="true">
      <div class="mobile-row">
        <button type="button" data-action="ctrl" aria-pressed="false">Ctrl</button>
        <button type="button" data-input="\u001b">Esc</button>
        <button type="button" data-input="\t">Tab</button>
        <button type="button" data-input="\u001b[D">←</button>
        <button type="button" data-input="\u001b[A">↑</button>
        <button type="button" data-input="\u001b[B">↓</button>
        <button type="button" data-input="\u001b[C">→</button>
        <button type="button" data-action="toggle-extra">…</button>
      </div>
      <div class="mobile-row extra" hidden>
        <button type="button" data-input="\u001b">Alt</button>
        <button type="button" data-input="\u001b[5~">PgUp</button>
        <button type="button" data-input="\u001b[6~">PgDn</button>
        <button type="button" data-input="|">|</button>
      </div>
    </div>

      <div class="error-title"></div>
      <div class="error-detail"></div>
